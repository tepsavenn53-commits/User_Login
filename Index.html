
<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ប្រព័ន្ធគ្រប់គ្រងពិន្ទុ - សាលាបឋមសិក្សា ម៉ឹង សំផន</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Moul&family=Battambang:wght@300;400;700;900&display=swap');
    body { font-family: 'Battambang', sans-serif; font-size: 13px !important; }
    .font-muol { font-family: 'Moul', serif; }
    .glass { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.2); }
  </style>
</head>
<body class="bg-slate-900 min-h-screen text-slate-850">

  <!-- ==================== LOGIN SCREEN ==================== -->
  <div id="login-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-teal-900 via-slate-900 to-black"></div>
    <div class="glass w-full max-w-md p-8 rounded-3xl shadow-2xl relative z-10 text-white">
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-gradient-to-tr from-teal-400 to-emerald-600 rounded-2xl flex items-center justify-center shadow-lg mx-auto mb-4">
          <i data-lucide="graduation-cap" class="w-10 h-10"></i>
        </div>
        <h1 class="font-muol text-2xl">ប្រព័ន្ធគ្រប់គ្រងសាលា</h1>
        <p class="text-teal-200 mt-2 font-bold">សាលាបឋមសិក្សា ម៉ឹង សំផន</p>
      </div>

      <form onsubmit="verifyLogin(event)" class="space-y-5">
        <div>
          <label class="text-sm font-bold mb-1.5 block">ឈ្មោះអ្នកប្រើប្រាស់</label>
          <input type="text" id="username" placeholder="admin" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-teal-500/50 focus:outline-none focus:ring-2 focus:ring-teal-400">
        </div>
        <div>
          <label class="text-sm font-bold mb-1.5 block">លេខកូដសម្ងាត់</label>
          <input type="password" id="password" placeholder="••••••••" class="w-full px-4 py-3 bg-white/5 border border-white/10 rounded-xl text-white placeholder-teal-500/50 focus:outline-none focus:ring-2 focus:ring-teal-400">
        </div>
        <button type="submit" id="btn-login" class="w-full bg-gradient-to-r from-teal-500 to-emerald-600 font-bold py-3.5 rounded-xl shadow-lg transition-transform hover:scale-[1.02]">
          ចូលប្រើប្រាស់ប្រព័ន្ធ
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== MAIN APP SCREEN ==================== -->
  <div id="app-screen" class="hidden min-h-screen">
    <!-- លោកគ្រូអាចដាក់កូដប្រព័ន្ធវាយតម្លៃពិន្ទុដែលខ្ញុំបានបង្កើតជូនពីមុន នៅត្រង់នេះ -->
    <div class="max-w-7xl mx-auto p-10 text-white text-center">
      <h1 class="text-3xl font-muol mb-4">ស្វាគមន៍មកកាន់ប្រព័ន្ធគ្រប់គ្រង!</h1>
      <button onclick="logout()" class="px-6 py-2 bg-rose-600 rounded-lg font-bold">ចាកចេញ</button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    // ពិនិត្យសិទ្ធិ Login ពេលផ្ទុកទំព័រ
    window.onload = () => {
      if (localStorage.getItem('isLoggedIn') === 'true') {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('app-screen').classList.remove('hidden');
      }
    };

    // មុខងារផ្ទៀងផ្ទាត់
    function verifyLogin(event) {
      event.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      const btn = document.getElementById('btn-login');

      if (user === "admin" && pass === "123456") {
        btn.innerText = "កំពុងចូល...";
        localStorage.setItem('isLoggedIn', 'true');
        setTimeout(() => {
          document.getElementById('login-screen').style.display = 'none';
          document.getElementById('app-screen').classList.remove('hidden');
          location.reload();
        }, 800);
      } else {
        alert("ឈ្មោះអ្នកប្រើ ឬលេខកូដសម្ងាត់មិនត្រឹមត្រូវ!");
      }
    }

    function logout() {
      localStorage.removeItem('isLoggedIn');
      location.reload();
    }
  </script>
</body>
</html>
