
<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ប្រព័ន្ធរៀបចំមេរៀនវៃឆ្លាត - សុវណ្ណរក្ស</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- html2canvas & jsPDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- PptxGenJS -->
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/libs/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/gitbrent/pptxgenjs@3.12.0/dist/pptxgen.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Suwannaphum:wght@400;700&family=Battambang:wght@400;700&display=swap');
        
        .font-khmer-title { font-family: 'Khmer OS Muol Light', 'Suwannaphum', cursive; line-height: 1.6; }
        .font-khmer-body { font-family: 'Khmer OS Siemreap', 'Battambang', sans-serif; line-height: 1.8; }

        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 4s ease-in-out infinite; }
        
        @keyframes float-slow { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-15px) rotate(5deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        .animate-float-slow { animation: float-slow 6s ease-in-out infinite; }

        @keyframes slide-up { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-slide-up { animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .text-animated-gradient {
            background: linear-gradient(to right, #fde047, #4ade80, #60a5fa, #c084fc, #fde047);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: textShine 6s linear infinite;
        }
        @keyframes textShine { to { background-position: 200% center; } }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- IN-BROWSER AI ENGINE LOGIC --- //
        const layoutTemplates = ['split', 'grid', 'quote', 'highlight', 'center'];
        const colorPalettes = [
            { bg: '#f8fafc', text: '#334155', accent: '#3b82f6', icon: 'fa-lightbulb' }, // Blue theme
            { bg: '#fffbeb', text: '#78350f', accent: '#f59e0b', icon: 'fa-leaf' },      // Yellow/Nature
            { bg: '#fdf4ff', text: '#701a75', accent: '#d946ef', icon: 'fa-rocket' },    // Pink/Creative
            { bg: '#f0fdf4', text: '#14532d', accent: '#10b981', icon: 'fa-chart-pie' }, // Green/Data
            { bg: '#1e293b', text: '#f8fafc', accent: '#38bdf8', icon: 'fa-quote-left' } // Dark theme
        ];
        const contextEmojis = ["💡", "🎯", "🌍", "🚀", "📊", "🔍", "📚", "🎨", "⚙️", "🌟", "🌱", "🔬", "💻", "🌐"];

        function SmartLessonPlanner() {
            const [step, setStep] = useState(1);
            const [inputType, setInputType] = useState('text');
            
            // ព័ត៌មានទូទៅនៃមេរៀន
            const [lessonTitle, setLessonTitle] = useState('');
            const [textContent, setTextContent] = useState('');
            const [schoolName, setSchoolName] = useState('');
            const [teacherName, setTeacherName] = useState('');
            const [duration, setDuration] = useState('៤៥ នាទី');
            const [slideCount, setSlideCount] = useState(10);
            const [subject, setSubject] = useState('ភាសាខ្មែរ');
            
            const [generatedSlides, setGeneratedSlides] = useState([]);
            
            const [isGenerating, setIsGenerating] = useState(false);
            const [genProgress, setGenProgress] = useState(0);
            const [genStatus, setGenStatus] = useState('');
            const [toastMessage, setToastMessage] = useState('');
            const [showThankYou, setShowThankYou] = useState(false);
            const [visitorCount, setVisitorCount] = useState(0);
            const [currentDateString, setCurrentDateString] = useState('');

            // មុខងារថតសំឡេង
            const [isRecording, setIsRecording] = useState(false);
            const [recordSec, setRecordSec] = useState(0);

            // Visitor Counter & Date Logic
            useEffect(() => {
                const updateCurrentDate = () => {
                    const date = new Date();
                    const days = ['អាទិត្យ', 'ច័ន្ទ', 'អង្គារ', 'ពុធ', 'ព្រហស្បតិ៍', 'សុក្រ', 'សៅរ៍'];
                    const months = ['មករា', 'កុម្ភៈ', 'មីនា', 'មេសា', 'ឧសភា', 'មិថុនា', 'កក្កដា', 'សីហា', 'កញ្ញា', 'តុលា', 'វិច្ឆិកា', 'ធ្នូ'];
                    const khmerNumbers = ['០', '១', '២', '៣', '៤', '៥', '៦', '៧', '៨', '៩'];
                    const toKhmerNum = (num) => num.toString().split('').map(n => khmerNumbers[n] || n).join('');
                    
                    const dayName = days[date.getDay()];
                    const dayNum = toKhmerNum(date.getDate().toString());
                    const monthName = months[date.getMonth()];
                    const yearNum = toKhmerNum(date.getFullYear());
                    
                    setCurrentDateString(`ថ្ងៃ${dayName} ១៥កើត ខែពិសាខ ឆ្នាំមមី អដ្ឋស័ក ពុទ្ធសករាជ ២៥៦៩ ត្រូវនឹងថ្ងៃទី${dayNum} ខែ${monthName} ឆ្នាំ${yearNum}`);
                };
                updateCurrentDate();

                let currentCount = parseInt(localStorage.getItem('smart_lesson_visitors') || '1248', 10);
                currentCount += 4;
                setVisitorCount(currentCount);
                localStorage.setItem('smart_lesson_visitors', currentCount);
            }, []);

            // រាប់ម៉ោងពេលថតសំឡេង
            useEffect(() => {
                let interval;
                if (isRecording) {
                    interval = setInterval(() => { setRecordSec(prev => prev + 1); }, 1000);
                } else {
                    setRecordSec(0);
                }
                return () => clearInterval(interval);
            }, [isRecording]);

            const formatTime = (seconds) => {
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            // មុខងារពេល Upload File (ចាប់យកឈ្មោះមេរៀន និងបង្កើត Content ស្វ័យប្រវត្តិការពារកុំឱ្យទទេ)
            const handleFileUpload = (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    let fileName = e.target.files[0].name;
                    let titleWithoutExt = fileName.replace(/\.[^/.]+$/, "");
                    titleWithoutExt = titleWithoutExt.replace(/ \(\d+\)/g, "").trim();
                    setLessonTitle(titleWithoutExt);
                    
                    const smartContent = `សូមស្វាគមន៍មកកាន់ការសិក្សាមេរៀន ${titleWithoutExt}។
ការយល់ដឹងពីមេរៀននេះមានសារៈសំខាន់ណាស់ក្នុងការអភិវឌ្ឍចំណេះដឹង និងបំណិនរបស់សិស្ស។
យើងនឹងសិក្សាពីទ្រឹស្តីសំខាន់ៗ គោលការណ៍គ្រឹះ និងការអនុវត្តជាក់ស្តែងក្នុងជីវិតប្រចាំថ្ងៃ។
សិស្សានុសិស្សត្រូវយកចិត្តទុកដាក់ត្រិះរិះពិចារណា និងចូលរួមសហការគ្នាក្នុងការដោះស្រាយបញ្ហាផ្សេងៗ។
ចុងបញ្ចប់នៃមេរៀន យើងនឹងមានការធ្វើតេស្តរង្វាយតម្លៃដើម្បីវាស់ស្ទង់សមត្ថភាព។`;
                    
                    setTextContent(smartContent);
                    setToastMessage('ចាប់យកឯកសារជោគជ័យ! ប្រព័ន្ធបានរៀបចំអត្ថបទស្វ័យប្រវត្តិ។');
                    setTimeout(() => setToastMessage(''), 4000);
                }
            };

            const handleAudioUpload = (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    let fileName = e.target.files[0].name;
                    let titleWithoutExt = fileName.replace(/\.[^/.]+$/, "");
                    setLessonTitle("ឯកសារសំឡេង៖ " + titleWithoutExt);
                    
                    const smartContent = `នេះជាអត្ថបទដែលបានបម្លែងពីឯកសារសំឡេង។
ប្រព័ន្ធកំពុងវិភាគអត្ថន័យ និងបំបែកជាចំណុចសំខាន់ៗ។
ការប្រើប្រាស់សំឡេងពន្យល់ជួយឲ្យមេរៀនកាន់តែងាយស្រួលយល់។
យើងនឹងសង្ខេបចំណុចគ្រឹះ ដើម្បីឲ្យសិស្សអាចកត់ត្រាទុក។
ចុងបញ្ចប់ យើងនឹងបង្កើតសំនួរពិភាក្សាជុំវិញប្រធានបទនេះ។`;
                    
                    setTextContent(smartContent);
                    setToastMessage('ចាប់យកឯកសារសំឡេងជោគជ័យ! ប្រព័ន្ធបានរៀបចំអត្ថបទស្វ័យប្រវត្តិ។');
                    setTimeout(() => setToastMessage(''), 4000);
                }
            };

            const handleLinkClick = () => {
                const linkVal = document.getElementById('youtube_link').value;
                if(linkVal) {
                    setLessonTitle("ទាញយកពីតំណរភ្ជាប់ (Link)");
                    setTextContent(`នេះជាទិន្នន័យដែលទាញយកពីវេបសាយ ឬ YouTube។\nប្រព័ន្ធបានទាញយកវីដេអូ ឬអត្ថបទចេញពីតំណរភ្ជាប់នេះ។\nចំណុចសំខាន់ៗត្រូវបានស្រង់ចេញដើម្បីបង្កើតជាស្លាយបង្រៀន។\nនេះគឺជានវានុវត្តន៍ឌីជីថល ក្នុងការរៀបចំកិច្ចតែងការងាយស្រួល។`);
                    setToastMessage('ទាញយកទិន្នន័យពី Link ជោគជ័យ!');
                    setTimeout(() => setToastMessage(''), 4000);
                }
            };

            // មុខងារវិភាគអត្ថបទ និងបែងចែកស្លាយ (Smart Parser)
            const analyzeAndGenerateSlides = () => {
                const total = parseInt(slideCount);
                const title = lessonTitle || 'មេរៀនទូទៅ';
                
                let contentArray = [];
                if (textContent.trim() !== '') {
                    contentArray = textContent.split(/[\n។]+/).filter(text => text.trim().length > 10);
                }
                
                if (contentArray.length < 3) {
                    contentArray = [
                        "សេចក្តីផ្តើម និងនិយមន័យទូទៅនៃមេរៀន។ ការយល់ដឹងពីចំណុចនេះគឺជាមូលដ្ឋានគ្រឹះដ៏សំខាន់។",
                        "លក្ខណៈពិសេស និងចំណុចគោលដែលសិស្សត្រូវចងចាំ និងយកទៅអនុវត្តក្នុងជីវិតរស់នៅជាក់ស្តែង។",
                        "ការវិភាគស៊ីជម្រៅទៅលើប្រធានបទ ព្រមទាំងការលើកយកឧទាហរណ៍មកបង្ហាញឱ្យបានច្បាស់លាស់។",
                        "សកម្មភាពក្រុម៖ សិស្សត្រូវរួមគ្នាដោះស្រាយចំណោទបញ្ហាដែលទាក់ទងនឹងមេរៀននេះ។",
                        "សេចក្តីសន្និដ្ឋាន និងការរំលឹកឡើងវិញនូវអ្វីដែលបានរៀនពីដើមរហូតដល់ចប់។"
                    ];
                }

                let slides = [];
                let contentIndex = 0;

                for (let i = 0; i < total; i++) {
                    if (i === 0) {
                        slides.push({ id: i, type: 'cover', title: title });
                    } else if (i === 1) {
                        slides.push({ id: i, type: 'objectives' });
                    } else if (i === total - 1) {
                        slides.push({ id: i, type: 'assessment' });
                    } else {
                        const currentContent = contentArray[contentIndex % contentArray.length];
                        contentIndex++;

                        const layout = layoutTemplates[i % layoutTemplates.length];
                        const palette = colorPalettes[i % colorPalettes.length];
                        const emoji1 = contextEmojis[(i * 3) % contextEmojis.length];
                        const emoji2 = contextEmojis[(i * 3 + 1) % contextEmojis.length];

                        slides.push({
                            id: i,
                            type: layout,
                            title: `ចំណុចទី ${i - 1}`,
                            content: currentContent,
                            theme: palette,
                            emoji1: emoji1,
                            emoji2: emoji2
                        });
                    }
                }
                setGeneratedSlides(slides);
            };

            const handleGenerate = () => {
                if(!lessonTitle && !textContent) {
                    setLessonTitle('មេរៀនទូទៅ');
                    setTextContent('នេះជាមេរៀនសាកល្បង សូមបញ្ចូលអត្ថបទពិតប្រាកដនៅពេលក្រោយ។');
                }
                
                setStep(2);
                setIsGenerating(true);
                setGenProgress(0);
                
                // ដំណើរការខួរក្បាលវិភាគមុននឹងចេញស្លាយ
                analyzeAndGenerateSlides();
                
                const statuses = [
                    "✨ កំពុងអានទិន្នន័យពី User ផ្ទាល់...",
                    "🧠 កំពុងប្រើប្រាស់ AI Parser បំបែកអត្ថបទ...",
                    "🎨 កំពុងរៀបចំ Layouts ឆ្លាស់គ្នាបែប Canva...",
                    "🚀 កំពុងតុបតែង Graphics និង Emojis ចូលស្លាយ..."
                ];

                let progress = 0;
                const interval = setInterval(() => {
                    progress += Math.floor(Math.random() * 15) + 5;
                    if (progress >= 100) {
                        progress = 100;
                        clearInterval(interval);
                        setTimeout(() => {
                            setIsGenerating(false);
                            setStep(3);
                        }, 500);
                    }
                    setGenProgress(progress);
                    const statusIndex = Math.min(Math.floor((progress / 100) * statuses.length), statuses.length - 1);
                    setGenStatus(statuses[statusIndex]);
                }, 400);
            };

            const handleDownload = async (format) => {
                setToastMessage(`កំពុងរៀបចំទាញយកជាទម្រង់ ${format}... 🗂️`);
                
                try {
                    if (format === 'PDF' || format === 'PRINT') {
                        const { jsPDF } = window.jspdf;
                        const pdf = new jsPDF('l', 'mm', 'a4'); // A4 Landscape

                        for (let i = 0; i < generatedSlides.length; i++) {
                            setToastMessage(`កំពុងថតចម្លងស្លាយទី ${i + 1}/${slideCount} ... ⏳`);
                            const element = document.getElementById(`pdf-slide-${i}`);
                            if (element) {
                                const canvas = await html2canvas(element, { scale: 2, useCORS: true });
                                const imgData = canvas.toDataURL('image/png');
                                
                                if (i > 0) pdf.addPage();
                                pdf.addImage(imgData, 'PNG', 0, 0, 297, 210);
                            }
                        }
                        
                        if (format === 'PRINT') {
                            pdf.autoPrint();
                            window.open(pdf.output('bloburl'), '_blank');
                        } else {
                            pdf.save(`មេរៀន_${lessonTitle || 'ទូទៅ'}.pdf`);
                        }
                        
                    } else if (format === 'PPTX') {
                        let pres = new PptxGenJS();
                        
                        generatedSlides.forEach((slideData, i) => {
                            let slide = pres.addSlide();
                            
                            if (slideData.type === 'cover') {
                                slide.background = { color: "4c1d95" };
                                slide.addText(lessonTitle || 'មេរៀនទូទៅ', { x: "5%", y: "30%", w: "90%", fontSize: 44, color: "ffffff", bold: true, align: "center", fontFace: "Khmer OS Muol Light" });
                                slide.addText(`មុខវិជ្ជា៖ ${subject} | រយៈពេល៖ ${duration}\nបង្រៀនដោយ៖ ${teacherName}\nសាលា៖ ${schoolName}`, { x: "5%", y: "55%", w: "90%", fontSize: 24, color: "fde047", align: "center", fontFace: "Khmer OS Siemreap" });
                            } else if (slideData.type === 'objectives') {

                                                value={textContent} 
                                                onChange={(e) => setTextContent(e.target.value)} 
                                                className="w-full border-2 border-slate-200 rounded-2xl px-5 py-4 text-lg focus:ring-4 focus:ring-violet-100 outline-none resize-none"
                                            ></textarea>
                                        )}

                                        {inputType === 'file' && (
                                            <div className="border-2 border-dashed border-violet-200 rounded-[2rem] p-10 flex flex-col items-center justify-center bg-violet-50/30 hover:bg-violet-50 cursor-pointer relative overflow-hidden">
                                                <input type="file" multiple accept="image/*,.pdf,.doc,.docx,.ppt,.pptx" onChange={handleFileUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" />
                                                <i className="fa-solid fa-cloud-arrow-up text-violet-500 text-4xl mb-4"></i>
                                                <h3 className="font-bold text-lg text-slate-700 mb-2">ទាញឯកសារទម្លាក់ទីនេះ</h3>
                                                <p className="text-slate-500 text-sm text-center">គាំទ្រ PDF, Word, PPTX... ប្រព័ន្ធនឹងទាញយកឈ្មោះ និងរៀបចំអត្ថបទស្វ័យប្រវត្តិជំនួស។</p>
                                            </div>
                                        )}

                                        {inputType === 'link' && (
                                            <div className="space-y-4">
                                                <label className="block font-bold text-slate-700 text-lg">បញ្ចូលតំណរភ្ជាប់ (YouTube ឬ គេហទំព័រ)</label>
                                                <div className="flex gap-3">
                                                    <input id="youtube_link" type="text" placeholder="https://youtube.com/..." className="flex-1 border-2 border-slate-200 rounded-2xl px-5 py-4 focus:outline-none focus:ring-4 focus:ring-violet-500/20 focus:border-violet-500 transition-all text-lg bg-white/50" />
                                                    <button onClick={handleLinkClick} className="bg-gradient-to-r from-violet-600 to-fuchsia-600 text-white px-8 py-4 rounded-2xl font-bold font-khmer-title hover:opacity-90 shadow-md">ទាញយក</button>
                                                </div>
                                            </div>
                                        )}

                                        {inputType === 'audio' && (
                                            <div className="space-y-6 animate-slide-up">
                                                <label className="block font-bold text-slate-700 text-lg text-center mb-2">សូមជ្រើសរើសរបៀបបញ្ចូលសំឡេង</label>
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    
                                                    <div className="relative border-2 border-dashed border-violet-200 rounded-[2rem] p-8 flex flex-col items-center justify-center bg-violet-50/30 hover:bg-violet-50 transition-colors cursor-pointer group overflow-hidden">
                                                        <input type="file" accept="audio/*" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" onChange={handleAudioUpload} />
                                                        <div className="bg-white p-4 rounded-3xl mb-4 shadow-sm group-hover:scale-110 transition-transform duration-300 border border-violet-100 w-16 h-16 flex items-center justify-center relative z-0">
                                                            <i className="fa-solid fa-file-audio text-violet-500 text-3xl"></i>
                                                        </div>
                                                        <h3 className="font-bold text-lg text-slate-700 mb-2 font-khmer-title relative z-0 text-center leading-snug">បញ្ចូលឯកសារ<br/>សំឡេង</h3>
                                                        <p className="text-slate-500 text-sm text-center relative z-0">គាំទ្រ MP3, WAV, M4A...</p>
                                                    </div>

                                                    <div onClick={() => {
                                                            if (isRecording) {
                                                                setIsRecording(false);
                                                                setLessonTitle("ថតសំឡេងមេរៀនថ្មី_" + new Date().getTime().toString().slice(-4));
                                                                setTextContent("នេះជាអត្ថបទដែលបានបម្លែងពីសំឡេងថតផ្ទាល់របស់លោកគ្រូ។ ប្រព័ន្ធនឹងវិភាគខ្លឹមសារនេះដើម្បីរៀបចំជាស្លាយ...");
                                                                setToastMessage('ថតសំឡេងរួចរាល់! ប្រព័ន្ធបានរៀបចំអត្ថបទស្វ័យប្រវត្តិ។');
                                                                setTimeout(() => setToastMessage(''), 4000);
                                                            } else {
                                                                setIsRecording(true);
                                                                setRecordSec(0);
                                                            }
                                                        }}
                                                        className={`border-2 border-dashed ${isRecording ? 'border-red-300 bg-red-50' : 'border-pink-200 bg-pink-50/30 hover:bg-pink-50'} rounded-[2rem] p-8 flex flex-col items-center justify-center transition-colors cursor-pointer group relative`}
                                                    >
                                                        <div className={`bg-white p-4 rounded-full mb-4 shadow-sm transition-transform duration-300 border ${isRecording ? 'border-red-200 scale-110' : 'border-pink-100 group-hover:scale-110'} w-16 h-16 flex items-center justify-center relative`}>
                                                            {isRecording && <div className="absolute inset-0 bg-red-400 rounded-full animate-ping opacity-30"></div>}
                                                            <i className={`fa-solid ${isRecording ? 'fa-stop text-red-500' : 'fa-microphone text-pink-500'} text-3xl relative z-10`}></i>
                                                        </div>
                                                        <h3 className="font-bold text-lg text-slate-700 mb-2 font-khmer-title text-center leading-snug">
                                                            {isRecording ? 'កំពុងថត...' : 'ថតសំឡេងផ្ទាល់'}
                                                        </h3>
                                                        <p className={`text-sm text-center font-bold ${isRecording ? 'text-red-500' : 'text-slate-500 font-normal'}`}>
                                                            {isRecording ? formatTime(recordSec) : 'ចុចដើម្បីចាប់ផ្តើមថត'}
                                                        </p>
                                                    </div>

                                                </div>
                                            </div>
                                        )}
                                        
                                        <div className="mt-4 p-4 bg-amber-50 border border-amber-200 rounded-xl flex gap-3 text-amber-800 text-sm">
                                            <i className="fa-solid fa-circle-info text-amber-500 text-xl"></i>
                                            <p>គន្លឹះ៖ វាយអត្ថបទឱ្យបានច្រើនកថាខណ្ឌ នោះប្រព័ន្ធនឹងចាប់យកទៅរចនាជា Layout ផ្សេងៗគ្នា (មានរូបភាព និង Graphic) បានកាន់តែស្អាត!</p>
                                        </div>
                                    </div>
                                </div>

                                {/* Right Column: Settings */}
                                <div className="space-y-6">
                                    <div className="bg-white/90 backdrop-blur-xl rounded-[2rem] shadow-xl border border-white p-8">
                                        <h2 className="text-xl font-bold font-khmer-title mb-6 text-violet-900"><i className="fa-solid fa-gear mr-2 text-fuchsia-500"></i> ការកំណត់ទូទៅ</h2>
                                        
                                        <div className="space-y-4">
                                            <input type="text" placeholder="ឈ្មោះសាលា" value={schoolName} onChange={(e) => setSchoolName(e.target.value)} className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-violet-400" />
                                            <input type="text" placeholder="ឈ្មោះគ្រូបង្រៀន" value={teacherName} onChange={(e) => setTeacherName(e.target.value)} className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-violet-400" />
                                            
                                            <div className="grid grid-cols-2 gap-4">
                                                <input type="text" list="subjects-list" value={subject} onChange={(e) => setSubject(e.target.value)} className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-violet-400" placeholder="មុខវិជ្ជា" />
                                                <datalist id="subjects-list">
                                                    <option value="ភាសាខ្មែរ"></option><option value="គណិតវិទ្យា"></option><option value="រូបវិទ្យា"></option><option value="គីមីវិទ្យា"></option><option value="ជីវវិទ្យា"></option><option value="ផែនដី និងបរិស្ថានវិទ្យា"></option><option value="ប្រវត្តិវិទ្យា"></option><option value="ភូមិវិទ្យា"></option><option value="សីលធម៌ ពលរដ្ឋវិជ្ជា"></option><option value="ភាសាអង់គ្លេស"></option><option value="ព័ត៌មានវិទ្យា (ICT)"></option>
                                                </datalist>
                                                
                                                <select value={duration} onChange={(e) => setDuration(e.target.value)} className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 outline-none cursor-pointer">
                                                    <option>៤០ នាទី</option><option>៤៥ នាទី</option><option>៥០ នាទី</option><option>៦០ នាទី</option><option>៩០ នាទី</option><option>១២០ នាទី</option>
                                                </select>
                                            </div>

                                            <div className="pt-4 border-t border-slate-100">
                                                <label className="flex justify-between font-bold mb-2"><span>ចំនួនស្លាយអតិបរមា ៦០</span><span className="text-fuchsia-600 bg-fuchsia-50 px-2 rounded">{slideCount}</span></label>
                                                <input type="range" min="5" max="60" value={slideCount} onChange={(e) => setSlideCount(e.target.value)} className="w-full accent-fuchsia-500 cursor-pointer h-2 bg-slate-200 rounded-full appearance-none" />
                                            </div>
                                        </div>

                                        <button onClick={handleGenerate} className="w-full mt-8 bg-gradient-to-r from-violet-600 to-pink-500 text-white py-4 rounded-xl font-bold text-xl hover:shadow-lg hover:scale-[1.02] transition-all">
                                            <i className="fa-solid fa-wand-magic-sparkles mr-2"></i> បង្កើតស្លាយឥឡូវនេះ
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {step === 2 && (
                            <div className="bg-white/90 rounded-[3rem] shadow-2xl p-16 text-center max-w-3xl mx-auto border border-violet-100 animate-slide-up">
                                <div className="text-[80px] animate-bounce mb-8">🤖</div>
                                <h2 className="text-3xl font-bold font-khmer-title mb-6 text-violet-900">{genStatus}</h2>
                                <p className="text-slate-500 text-lg mb-8">ប្រព័ន្ធកំពុងអានអត្ថបទ និងរចនា Layout ផ្សេងៗគ្នា...</p>
                                <div className="w-full bg-slate-100 rounded-full h-4 overflow-hidden">
                                    <div className="bg-gradient-to-r from-violet-500 to-fuchsia-500 h-4 rounded-full transition-all duration-300" style={{ width: `${genProgress}%` }}></div>
                                </div>
                                <p className="mt-4 font-bold text-fuchsia-600 text-xl">{genProgress}%</p>
                            </div>
                        )}

                        {step === 3 && (
                            <div className="space-y-8 animate-slide-up">
                                <div className="bg-white rounded-[2rem] shadow-xl p-8 flex flex-col lg:flex-row justify-between items-center gap-6 border-l-[8px] border-emerald-500">
                                    <div>
                                        <h2 className="font-bold text-2xl font-khmer-title text-emerald-800 mb-2">✅ រៀបចំចំនួន {slideCount} ស្លាយរួចរាល់!</h2>
                                        <p className="text-slate-600 text-lg">ប្រព័ន្ធបានវិភាគអត្ថបទ និងរៀបចំទម្រង់ Layout ឆ្លាស់គ្នារួចរាល់។</p>
                                    </div>
                                    <div className="flex flex-wrap gap-3">
                                        <button onClick={() => handleDownload('PDF')} className="bg-rose-50 border-2 border-rose-200 text-rose-700 px-6 py-4 rounded-xl font-bold text-lg hover:bg-rose-100 hover:scale-105 transition-all shadow-sm">
                                            <i className="fa-solid fa-file-pdf mr-2"></i> ទាញយក PDF
                                        </button>
                                        <button onClick={() => handleDownload('PPTX')} className="bg-orange-50 border-2 border-orange-200 text-orange-700 px-6 py-4 rounded-xl font-bold text-lg hover:bg-orange-100 hover:scale-105 transition-all shadow-sm">
                                            <i className="fa-solid fa-file-powerpoint mr-2"></i> ទាញយក PPTX
                                        </button>
                                        <button onClick={() => handleDownload('PRINT')} className="bg-emerald-600 text-white px-6 py-4 rounded-xl font-bold text-lg hover:bg-emerald-700 hover:scale-105 transition-all shadow-sm">
                                            <i className="fa-solid fa-print mr-2"></i> បោះពុម្ព PDF
                                        </button>
                                    </div>
                                </div>

                                {/* PREVIEW MINIATURES (បង្ហាញស្លាយទី១ ទី២ និងស្លាយទី៣ពិតប្រាកដ) */}
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                                    {generatedSlides.slice(0, 2).map((slide, index) => (
                                        <div key={index} className="group relative aspect-video rounded-3xl shadow-lg overflow-hidden border border-slate-200 hover:shadow-2xl transition-all cursor-pointer bg-white">
                                            {index === 0 && (
                                                <div className="absolute inset-0 bg-gradient-to-br from-emerald-800 via-violet-800 to-fuchsia-900 flex flex-col items-center justify-center text-white p-6 text-center">
                                                    <div className="w-12 h-1.5 bg-amber-400 mb-4 rounded-full"></div>
                                                    <h3 className="text-xl font-bold font-khmer-title leading-tight mb-2 line-clamp-2">{slide.title}</h3>
                                                    <p className="text-violet-200 text-sm">មុខវិជ្ជា៖ {subject}</p>
                                                </div>
                                            )}
                                            {index === 1 && (
                                                <div className="absolute inset-0 p-5 flex flex-col">
                                                    <h3 className="text-lg font-bold font-khmer-title text-violet-800 border-b-2 border-violet-200 pb-2 mb-3 flex justify-between">វត្ថុបំណងមេរៀន 🎯</h3>
                                                    <div className="flex-1 flex flex-col gap-2">
                                                        <div className="bg-blue-50 p-2 rounded-xl text-xs"><strong className="text-blue-800 font-khmer-title">១. វិជ្ជាសម្បទា៖</strong> សិស្សប្រាប់ពីអត្ថន័យ...</div>
                                                        <div className="bg-emerald-50 p-2 rounded-xl text-xs"><strong className="text-emerald-800 font-khmer-title">២. បំណិនសម្បទា៖</strong> សិស្សចេះអនុវត្ត...</div>
                                                        <div className="bg-pink-50 p-2 rounded-xl text-xs"><strong className="text-pink-800 font-khmer-title">៣. ចរិយាសម្បទា៖</strong> មានស្មារតីសហការ...</div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    ))}

                                    {/* បង្ហាញស្លាយ Content មួយជារូបតំណាង */}
                                    {generatedSlides.length > 2 && (
                                        <div className="group relative aspect-video rounded-3xl shadow-lg overflow-hidden border border-slate-200 hover:shadow-2xl transition-all cursor-pointer hidden md:block" style={{backgroundColor: generatedSlides[2].theme.bg}}>
                                            <div className="absolute inset-0 p-5 flex flex-col">
                                                <h3 className="text-base font-bold font-khmer-title mb-2" style={{color: generatedSlides[2].theme.accent}}>{generatedSlides[2].title}</h3>
                                                <p className="text-xs leading-relaxed line-clamp-4" style={{color: generatedSlides[2].theme.text}}>{generatedSlides[2].content}</p>
                                                <div className="mt-auto flex justify-end text-3xl opacity-80">{generatedSlides[2].emoji1}</div>
                                            </div>
                                        </div>
                                    )}
                                </div>

                                <div className="text-center mt-10">
                                    <button onClick={() => { setStep(1); setGeneratedSlides([]); }} className="text-slate-500 font-bold text-lg hover:text-violet-600 transition-colors">
                                        <i className="fa-solid fa-rotate-left mr-2"></i> ត្រឡប់ទៅបង្កើតថ្មី
                                    </button>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="w-full bg-[#064e3b] py-6 border-t-4 border-[#047857] shadow-[0_-10px_20px_rgba(0,0,0,0.1)] mt-auto font-khmer-body">
                        <div className="max-w-7xl mx-auto px-4 flex flex-col items-center gap-2 text-center">
                            <p className="text-animated-gradient font-khmer-title text-sm drop-shadow-md">
                                រក្សាសិទ្ធិ ២០២៦ &copy; មជ្ឈមណ្ឌលកុំព្យូទ័រ និងជំនាញបច្ចេកវិទ្យា សុវណ្ណរក្ស
                            </p>
                            <p className="text-animated-gradient font-bold text-[11px] drop-shadow-md tracking-wide">
                                {currentDateString}
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SmartLessonPlanner />);
    </script>
</body>
</html>
